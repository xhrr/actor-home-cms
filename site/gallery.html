<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>写真</title>
    <meta name="description" content="演员写真集">
    <link rel="stylesheet" href="/css/editorial.css">
    <script src="/js/config.js"></script>
    <script src="/js/cms.js"></script>
</head>
<body>
    <nav class="nav" id="nav">
        <a href="/" class="nav__logo" id="navLogo"></a>
        <button class="nav__toggle" id="navToggle" aria-label="菜单" aria-expanded="false">
            <span></span><span></span><span></span>
        </button>
        <ul class="nav__links" id="navLinks"></ul>
    </nav>

    <main class="gallery-page">
        <div class="gallery-page__top" id="galleryTop"></div>
        <div class="gallery-page__content" id="galleryGrid"></div>
    </main>

    <div id="lightbox" class="lightbox" style="display:none" role="dialog" aria-modal="true">
        <button class="lightbox__close" id="lightbox-close" aria-label="关闭">&times;</button>
        <button class="lightbox__nav lightbox__nav--prev" id="lightbox-prev" aria-label="上一张">&#10094;</button>
        <button class="lightbox__nav lightbox__nav--next" id="lightbox-next" aria-label="下一张">&#10095;</button>
        <img id="lightbox-img" src="" alt="放大预览">
        <span class="lightbox__counter" id="lightbox-counter"></span>
    </div>

    <script src="/js/gallery.js"></script>
</body>
</html>
